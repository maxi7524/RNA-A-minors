[project]
name = "aminor-msa"
version = "0.1.0"
description = "Reproducible data acquisition and A-minor prediction from RNA alignments"
requires-python = ">=3.11,<3.14"
dependencies = ["gdown>=6.4.1,<7", "gemmi>=0.7,<0.8"]

[project.optional-dependencies]
cpu = ["torch==2.7.1"]
cu118 = ["torch==2.7.1"]
notebook = [
    "ipykernel>=6,<8", "py3Dmol>=2.4,<3",
    "pandas>=2.2,<4", "ipywidgets>=8.1,<9",
    "nbformat>=5.10,<6", "nbclient>=0.10,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aminor_msa"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu118" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu118", extra = "cu118" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
